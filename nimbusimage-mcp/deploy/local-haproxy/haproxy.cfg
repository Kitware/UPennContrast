# Local rehearsal of the PROPOSED production HAProxy rules for the MCP service
# (codebaseDocumentation/NIMBUSIMAGE_MCP_SERVER.md, Phase 2 and Phase 4).
# Mirrors AWSDeploy templates/startup_haproxy.tftpl (frontend nimbus-backends,
# timeouts, the girder backend's path rewrite) with the MCP additions. Local
# differences, each marked LOCAL below:
#   - plain HTTP on :80; TLS ends at the tunnel, which sets X-Forwarded-Proto
#     (stands in for ssl_fc) and Cf-Connecting-Ip;
#   - Girder is NOT reachable through the tunnel (the local stack keeps the
#     default admin password); the worker rate limit is left out;
#   - servers are found through Docker's DNS (resolvers below), so the mcp
#     container can be recreated while HAProxy runs.

global
  log stdout format raw local0

# LOCAL: Docker's embedded DNS; re-resolve when containers are recreated
resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 5s

defaults
  mode http
  timeout client 10s
  timeout connect 5s
  timeout server 300s
  timeout http-request 10s
  timeout check 5s
  timeout tunnel 1h
  log global
  option httplog

frontend nimbus-backends
  bind :80
  # LOCAL: record who calls, for the connector observations
  http-request capture req.hdr(User-Agent) len 100
  http-request capture req.hdr(Mcp-Protocol-Version) len 20

  # Narrowed from path_beg /.well-known/ so OAuth metadata is never served
  # over plain HTTP; only ACME renewal is exempt from the HTTPS redirect.
  acl acme_challenge path_beg /.well-known/acme-challenge/
  # LOCAL: the tunnel terminates TLS
  acl via_https req.hdr(X-Forwarded-Proto) -i https

  http-request redirect scheme https unless via_https || acme_challenge

  # MCP service (static backend) and its OAuth discovery documents. Exact
  # paths only: no path_beg /.well-known/ rule. The protected-resource
  # metadata for resource <base>/mcp lives at the path-suffixed URL
  # (RFC 9728 section 3.1), which is what the 401 challenge points to.
  acl is_mcp path /mcp
  acl is_mcp_resource_metadata path /.well-known/oauth-protected-resource/mcp /.well-known/oauth-protected-resource
  # openid-configuration too: clients probe it after the AS metadata, and the
  # static server would answer it with index.html and a 200
  acl is_oauth_as_metadata path /.well-known/oauth-authorization-server /.well-known/openid-configuration
  use_backend nimbus-mcp if is_mcp || is_mcp_resource_metadata
  use_backend nimbus-girders if is_oauth_as_metadata

  use_backend nimbus-girders if { path /girder } || { path_beg /girder/ } || { path_beg //girder/ }
  default_backend static-server

backend nimbus-mcp
  mode http
  # A request without a key gets 401, so check for that rather than 200
  option httpchk GET /mcp
  http-check expect status 401
  server mcp mcp:8000 check resolvers docker init-addr last,libc,none

backend nimbus-girders
  mode http
  # LOCAL: never expose the shared local Girder through the tunnel, whatever
  # rule routed here, except the (404 until Phase 3) discovery documents
  http-request deny deny_status 403 if { req.hdr(Cf-Connecting-Ip) -m found } !{ path /.well-known/oauth-authorization-server /.well-known/openid-configuration }
  option httpchk GET /api/v1/system/version
  http-check expect status 200
  http-request set-path "%[path,regsub(^//girder,/)]"
  http-request set-path "%[path,regsub(^/girder,/)]"
  http-request set-path "%[path,regsub('/+','/','g')]"
  server girder girder:8080 check resolvers docker init-addr last,libc,none

backend static-server
  mode http
  server static-server static:80 check resolvers docker init-addr last,libc,none
